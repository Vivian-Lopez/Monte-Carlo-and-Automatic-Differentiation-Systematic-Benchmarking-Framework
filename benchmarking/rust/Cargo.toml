[package]
name = "rust_mc"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_mc"
crate-type = ["cdylib"]

[dependencies]
pyo3  = { version = "0.24", features = ["extension-module"] }
rayon = "1.10"
rand  = "0.9"
rand_distr = "0.5"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
